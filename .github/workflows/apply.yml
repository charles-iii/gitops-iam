name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: "us-east-1"

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Debug OIDC token subject
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo $OIDC_TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null || \
            echo $OIDC_TOKEN | cut -d'.' -f2 | python3 -c "import sys,base64; print(base64.b64decode(sys.stdin.read() + '==').decode())")
          echo "OIDC sub claim:"
          echo $PAYLOAD | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('sub','not found'))"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "gitops-iam-apply-${{ github.sha }}"

      - name: Terraform init
        working-directory: terraform/
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform/
        run: |
          terraform apply \
            -var="environment=dev" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="security_account_id=${{ secrets.SECURITY_ACCOUNT_ID }}" \
            -auto-approve \
            -input=false

      - name: Record apply in audit log
        if: always()
        run: |
          echo "APPLY RECORD" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Author | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
